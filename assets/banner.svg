<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07090f"/>
      <stop offset="1" stop-color="#0d1424"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.2" cy="0" r="0.7">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.85" cy="0" r="0.6">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="text" x1="0" x2="1">
      <stop offset="0" stop-color="#93c5fd"/>
      <stop offset="0.5" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#a5b4fc"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="20" fill="url(#glow1)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="7s" repeatCount="indefinite"/>
  </rect>
  <rect width="1200" height="300" rx="20" fill="url(#glow2)">
    <animate attributeName="opacity" values="1;0.55;1" dur="9s" repeatCount="indefinite"/>
  </rect>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="70" y="140" font-size="64" font-weight="700" fill="#e8ecf4">Roystan Passanha</text>
    <text x="72" y="190" font-size="26" fill="url(#text)">Data Analyst · SQL · Python · Power BI · Automation</text>
    <text x="72" y="235" font-size="18" fill="#8b95a8">Dubai, UAE</text>
  </g>
  <g transform="translate(900 95)" opacity="0.9">
    <rect x="0"   y="90"  width="34" height="40"  rx="5" fill="#1f4e8c"/>
    <rect x="50"  y="60"  width="34" height="70"  rx="5" fill="#2563eb"/>
    <rect x="100" y="75"  width="34" height="55"  rx="5" fill="#3b82f6"/>
    <rect x="150" y="30"  width="34" height="100" rx="5" fill="#22d3ee">
      <animate attributeName="height" values="100;84;100" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="y" values="30;46;30" dur="4s" repeatCount="indefinite"/>
    </rect>
    <rect x="200" y="5"   width="34" height="125" rx="5" fill="#67e8f9"/>
  </g>
</svg>
